<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Brawl Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
:root{--bg:#141a38;--card:#232b5c;--fg:#fff;--acc:#ffd23f;--hot:#ff4d3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a38;--card:#232b5c;--fg:#fff}}
:root[data-theme="dark"]{--bg:#141a38;--card:#232b5c;--fg:#fff}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Arial Black",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,26,56,.93);text-align:center;padding:16px;overflow:auto}
.ov.h{display:none}
h1{margin:0;font-size:clamp(34px,9vw,64px);color:var(--acc);text-shadow:0 4px 0 #b3411a,0 8px 0 rgba(0,0,0,.3);letter-spacing:1px;font-style:italic}
p{margin:0;opacity:.85;max-width:420px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{background:var(--card);border:4px solid #000;border-radius:18px;padding:12px;width:150px;cursor:pointer;box-shadow:0 6px 0 #000;color:var(--fg);font:inherit}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.card img{height:130px}.card b{display:block;margin:6px 0 2px;font-size:17px}.card span{font-size:12px;opacity:.8;display:block}
.btn{background:var(--acc);color:#000;border:4px solid #000;border-radius:14px;padding:12px 26px;font:inherit;font-size:20px;font-weight:900;box-shadow:0 5px 0 #000;cursor:pointer}
#menu{background:radial-gradient(circle at 50% 38%,#7b3fe4 0,#3a2a9c 45%,#141a38 100%);justify-content:space-between;gap:0;padding:max(10px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px))}
.top{display:flex;gap:10px;width:100%;max-width:560px;justify-content:space-between}
.pill{background:rgba(0,0,0,.45);border:3px solid #000;border-radius:999px;padding:6px 14px;font-weight:900;font-size:16px}
.stage{display:flex;align-items:center;gap:6px;flex:1;min-height:0}
.show{position:relative;height:min(40vh,300px);display:flex;align-items:flex-end;justify-content:center;min-width:180px}
.show img{height:100%;position:relative;z-index:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));animation:bob 1.6s ease-in-out infinite alternate}
.show:before{content:"";position:absolute;bottom:-8px;width:200px;height:44px;border-radius:50%;background:rgba(0,0,0,.35)}
@keyframes bob{to{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.show img{animation:none}}
.arr{background:rgba(0,0,0,.4);color:#fff;border:3px solid #000;border-radius:50%;width:46px;height:46px;font-size:18px;cursor:pointer}
.info{width:100%;max-width:420px}.info h2{margin:0;font-size:30px;font-style:italic;color:var(--acc);text-shadow:0 3px 0 #000}
.st{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px}.st span{width:54px;text-align:left}
.st i{flex:1;height:10px;background:#000;border-radius:6px;padding:2px;box-sizing:content-box}.st u{display:block;height:100%;background:#3ddc84;border-radius:5px}
.bar{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;justify-content:space-between;margin-top:10px}
.mode{background:rgba(0,0,0,.45);border:3px solid #000;border-radius:14px;padding:8px 12px;font-weight:900;text-align:left}.mode small{opacity:.7;font-weight:400}
.play{font-size:30px;padding:12px 44px;font-style:italic}
.tiles{display:flex;gap:8px}.tiles button{border:3px solid #000;border-radius:12px;background:var(--card);width:56px;height:62px;padding:2px;cursor:pointer}.tiles button.on{border-color:var(--acc);background:#5a3fc0}.tiles img{height:100%}
#sb{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:50%;border:4px solid #000;background:#555;color:#fff;font:900 13px inherit;opacity:.55;box-shadow:0 4px 0 #000}
#sb.r{background:var(--acc);color:#000;opacity:1;animation:pu .7s infinite alternate}
@keyframes pu{to{transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){#sb.r{animation:none}}
#sb.h{display:none}
</style></head><body>
<canvas id="c"></canvas>
<button id="sb" class="h">SUPER</button>
